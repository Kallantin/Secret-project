[package]
name = "arkham-horror-lcg"
version = "0.1.0"
description = "Arkham Horror: The Card Game — standalone digital implementation"
authors = ["Kallantin"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/Kallantin/Secret-project"
publish = false

[lib]
name = "arkham_horror_lcg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
rand_chacha = "0.3"

[features]
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
